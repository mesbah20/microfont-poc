<div [formGroup]="frmGroup" class="w-full max-w-[12rem] mx-auto">
  <!-- class="w-full sm:max-w-[12rem] md:max-w-[16rem] lg:max-w-[20rem] mx-auto" -->
  <label [for]="controlName" class="block mb-2 text-sm md:text-base font-medium text-gray-900 dark:text-white">
    {{ label }}
  </label>

  <div class="relative">
    <div class="absolute inset-y-0 end-0 top-0 flex items-center pe-3.5 pointer-events-none">
      <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
        fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" d="M2 12C2 6.477..." clip-rule="evenodd" />
      </svg>
    </div>

    <input type="time" [id]="controlName" [formControlName]="controlName" [readonly]="isReadonly"
      [disabled]="isReadonly" [min]="minTime" [max]="maxTime" [placeholder]="placeholder" class="bg-gray-50 border leading-none border-gray-300 text-gray-900 
             text-sm md:text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 
             block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 
             dark:placeholder-gray-400 dark:text-white 
             dark:focus:ring-blue-500 dark:focus:border-blue-500" (change)="onChange($event)" (blur)="onBlur()" />
  </div>

  <div *ngIf="
      frmGroup.get(controlName)?.errors &&
      (frmGroup.get(controlName)?.touched || frmGroup.get(controlName)?.dirty)" class="text-red-500 text-sm mt-1">
    <span *ngIf="frmGroup.get(controlName)?.hasError('required')">
      {{ label }} is required!
    </span>
  </div>
</div>
