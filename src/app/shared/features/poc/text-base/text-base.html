<div class="p-3 border rounded bg-white shadow">

  <div *ngFor="let f of viewObject.fields" class="mb-3">

    <label class="font-semibold">{{ f.label }}</label>

    <div
      class="p-2 border rounded bg-gray-50"
      [style.border-color]="highlightMap?.['fields.' + f.key] ? 'red' : '#ddd'"
    >
      {{ f.value }}
    </div>

  </div>

</div>
