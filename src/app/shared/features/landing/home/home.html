<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
  <main class="mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
      <h2 class="text-3xl font-bold text-slate-900 mb-2">Welcome back {{username}} !👋</h2>
      <p class="text-slate-600">Here's what's happening with your team today.</p>
    </div>


    <!-- Slider -->
    <div class="mb-8 relative rounded-2xl overflow-hidden shadow-lg group">
      <div class="relative h-220">
        <ng-container *ngFor="let slide of slides; index as i">
          <div
            class="absolute inset-0 transition-opacity duration-1000"
            [class.opacity-100]="i === currentSlide"
            [class.opacity-0]="i !== currentSlide"
          >
            <img [src]="slide.image" [alt]="slide.title" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 p-8 text-white">
              <h3 class="text-3xl font-bold mb-2">{{ slide.title }}</h3>
              <p class="text-lg text-white/90">{{ slide.description }}</p>
            </div>
          </div>
        </ng-container>
      </div>

      <!-- arrows -->
      <button (click)="prevSlide()"
              class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 backdrop-blur-sm p-3 rounded-full transition-all opacity-0 group-hover:opacity-100">
      </button>
      <button (click)="nextSlide()"
              class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/20 hover:bg-white/40 backdrop-blur-sm p-3 rounded-full transition-all opacity-0 group-hover:opacity-100">
      </button>

      <!-- dots -->
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
        <button *ngFor="let _ of slides; index as i"
                (click)="goToSlide(i)"
                class="rounded-full transition-all"
                [ngClass]="i === currentSlide ? 'bg-white w-8 h-2 rounded-full' : 'bg-white/50 w-2 h-2 hover:bg-white/75'">
        </button>
      </div>
    </div>


  </main>
</div>
