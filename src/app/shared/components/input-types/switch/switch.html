@if (!isHidden) {
  <div class="w-full" [formGroup]="frmGroup()">
    <!-- Switch Container -->
    <div class="flex items-center space-x-3">
      <!-- Custom Switch -->
      <div class="relative">
        <input
          type="checkbox"
          [id]="id()"
          [formControlName]="controlName()"
          [attr.controlName]="controlName()"
          [style]="style()"
          (change)="toggleSwitch()"
          class="sr-only">
        
        <!-- Switch Track -->
        <div 
          class="relative w-11 h-6 bg-gray-200 rounded-full cursor-pointer transition-all duration-300 ease-in-out shadow-inner"
          [ngClass]="{
            'bg-gray-200': !currentValue,
            'bg-gradient-to-r from-blue-500 to-blue-600': currentValue,
            'opacity-50 cursor-not-allowed': isDisabled,
            'ring-2 ring-red-300 ring-offset-2': isInvalidState()
          }"
          (click)="!isDisabled && toggleSwitch()">
          
          <!-- Switch Thumb -->
          <div 
            class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow-lg transform transition-all duration-300 ease-in-out flex items-center justify-center"
            [ngClass]="{'translate-x-5': currentValue, 'translate-x-0': !currentValue}">
            
            <!-- Check Icon (only visible when checked) -->
            @if (currentValue) {
              <svg 
                class="w-4 h-4 text-blue-600" 
                fill="currentColor" 
                viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
              </svg>
            }
            
            <!-- X Icon (only visible when unchecked) -->
            @if (!currentValue) {
              <svg 
                class="w-3 h-3 text-gray-400" 
                fill="currentColor" 
                viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
              </svg>
            }
          </div>
          
          <!-- Ripple Effect -->
          @if (currentValue) {
            <div 
              class="absolute inset-0 rounded-full bg-blue-200 opacity-20 animate-pulse">
            </div>
          }
        </div>
      </div>

      <!-- Label -->
      @if (labelText()) {
        <label [for]="id()" class="text-sm font-medium text-gray-700 cursor-pointer select-none">
          {{ labelText() }}
          @if (isRequired()) {
            <span class="text-red-500 ml-1">*</span>
          }
        </label>
      }
    </div>

    <!-- Error Message -->
    @if (isInvalidState()) {
      <div class="mt-2 text-sm text-red-600 flex items-center">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }
  </div>
}
