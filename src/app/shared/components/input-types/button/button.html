@if (!isHidden) {
  <button 
    [id]="id()"
    [type]="'button'"
    [disabled]="isDisabled"
    [style]="styles()"
    [ngClass]="buttonClasses"
    (click)="onButtonClick($event)"
    [attr.aria-label]="labelText() || value()"
    class="inline-flex items-center justify-center">

    @if (icon()) {
      <mat-icon class="w-3 h-3 mr-1 flex-shrink-0">{{icon()}}</mat-icon>
    }
    {{ labelText() || value() }}
  </button>
}
