<div class="xml-dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <div class="header-content align-items-center">
      <mat-icon class="header-icon ml-2">code</mat-icon>
      <h2 mat-dialog-title class="dialog-title">{{title}}</h2>
    </div>
    <button mat-icon-button mat-dialog-close class="close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  
  <!-- Content -->
  <mat-dialog-content class="dialog-content">
    <div class="xml-wrapper">
      <div class="xml-header">
        <span class="xml-label">{{subTitle}}</span>
        <button mat-icon-button (click)="copyToClipboard()" class="copy-icon-button" title="Copy to clipboard">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
      <div class="xml-content-container" #xmlContainer>
        <pre class="xml-text">{{xmlData}}</pre>
      </div>
    </div>
  </mat-dialog-content>
