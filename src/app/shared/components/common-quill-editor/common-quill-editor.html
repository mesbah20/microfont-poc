<div [formGroup]="formGroup" [class]="classProperty" class="grid gap-x-2">
  <span [class]="labelClass">
    {{ labelName }}
    @if (isRequired) {
      <span class="required">*</span>
    }
  </span>

  <div>
    <quill-editor
      [modules]="minModule"
      [formControlName]="controlName"
      class="w-full col-span-2 w-full break-words break-all whitespace-pre-wrap">
    </quill-editor>
  </div>
</div>
