<div class="page-wrapper">
  <div class="panel">
    <div class="profile-grid-container container p-2 my-2">
      <app-expansion-panel-header
        [isOpenSignal]="businessHeaderPanel"
        [panelTitle]="'Assign Roles to User'">
      </app-expansion-panel-header>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="component-section">
          <input-id-box
            [frmGroup]="userForm"
            [controlName]="'userId'"
            [label]="'User ID'"
            [isReadonly]="false"
            [isVertical]="true"
            [tooltip]="'ID'"
            [allowSpecialChars] = "true"
            [isDotsVisible]="true"
            (dotsClicked)="openModal()"
            (onBlurred)="onUserIdChange($event)">
          </input-id-box>
          <app-user-list-modal [showUserModal]="showUserModal" [userId]="userForm.get('user.userId')?.value ?? null"
                               (userSelected)="loadUser($event)"></app-user-list-modal>
        </div>
        <div class="component-section" *ngIf="showUserInfoBlock === false">
        <span style="min-width: 100px; font-weight: bolder; color: red;" >
          Invalid User ID!</span>
        </div>
        <div class="component-section" *ngIf="showUserInfoBlock === true">
          <input-text-box
            [frmGroup]="userForm"
            [controlName]="'userName'"
            [label]="'User Name'"
            [isReadonly]="true"
            [isVertical]="true">
          </input-text-box>
        </div>
        <div class="component-section" *ngIf="showUserInfoBlock === true">
          <input-select-option-field [frmGroup]="userForm" [isReadonly]="true"
                                   [controlName]="'homeOfficeId'" [label]="'Office ID'"
                                   [options]="officeOptions">
          </input-select-option-field>
        </div>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4" *ngIf="showUserInfoBlock === true">
        <div class="component-section">
          <input-text-box [frmGroup]="userForm"
                               [controlName]="'userDescription'" [label]="'User Description'"
                               [isVertical]="true" [isReadonly]="true">
          </input-text-box>
        </div>
        <div class="component-section">
          <input-text-box
            [frmGroup]="frmGroup"
            [controlName]="'userStatus'"
            [label]="'Active Status'"
            [isReadonly]="true"
            [isVertical]="true">
          </input-text-box>
        </div>
      </div>
    </div>
  </div>
</div>
<!--PACKAGE-->
<div class="page-wrapper" *ngIf="showUnassignedRoleGrid">
  <div class="panel">
    <!--<app-expansion-panel-header [isOpenSignal]="businessHeaderPanel" [panelTitle]="'Assign Roles to User'"/>-->
    <div class="container space-y-6 p-4 my-4 ">
      <div class="container flex items-start justify-center gap-6">

        <!-- Unassigned Package Grid -->
        <div class="w-1/2 min-w-[350px]" *ngIf="showUnassignedRoleGrid">
          <section class="transaction-grid-section bg-white rounded-lg shadow-sm p-4 h-[600px]">
            <app-sub-panel-header [subPanelTitle]="'Unassigned Roles'"/>
            <ng-container *ngIf="showUnassignedGrid">
              <generic-data-grid
                [id]="'unassigned-roles'"
                [enableSelection]="true"
                [useInlineEdit]="false"
                [dataSource]="unAssignedUserRole"
                [selectedColumns]="['roleName']"
                (onChecked)="onAddPackageRowSelect($event)"
                (onSelectAllChange)="onAddAllPackageRowSelect($event)"
                [initPageSize]="5">
              </generic-data-grid>
            </ng-container>
          </section>
        </div>

        <!-- Action Buttons -->

        <div style="width: 10%; min-width: 97px !important; background: transparent; border: 0; box-shadow: none;" class="panel panel-info" ng-hide="userRole.hideGrids">
          <div class="panel-body text-center ls-panel-body flex flex-col items-center gap-4"
               style="position: relative; top:123px;">
            <button mat-raised-button color="primary" class="action-btn" (click)="selectPackage()">
              <mat-icon>keyboard_double_arrow_right</mat-icon>
            </button>
            <button mat-raised-button color="warn" class="action-btn" (click)="removePackage()">
              <mat-icon>keyboard_double_arrow_left</mat-icon>
            </button>
          </div>

        </div>

        <!-- Assigned Package Grid -->
        <div class="w-1/2 min-w-[350px]" *ngIf="showUnassignedRoleGrid">
          <section class="transaction-grid-section bg-white rounded-lg shadow-sm p-4 h-[600px]">
          <app-sub-panel-header [subPanelTitle]="'Assigned Roles'"/>
            <ng-container *ngIf="showAssignedGrid">
              <generic-data-grid
                [id]="'assigned-roles'"
                [enableSelection]="true"
                [useInlineEdit]="true"
                [dataSource]="assignedUserRole"
                [selectedColumns]="['roleName','fromDt','toDt']"
                (onChecked)="onRemovePackageRowSelect($event)"
                [editableColumns]="['fromDt','toDt']"
                [initPageSize]="5"
                [showEditButton]="true"
                (onSelectAllChange)="onRemoveAllPackageRowSelect($event)"
                (onFHEditClick)="editPackage($event)"
                (dataSourceChanged)="onPackageChanged($event)">
              </generic-data-grid>
            </ng-container>
          </section>
        </div>

      </div>
    </div>
  </div>
</div>
