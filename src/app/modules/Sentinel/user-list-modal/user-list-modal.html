<div>
  <generic-modal [isVisible]="showUserModal" modalTitle="User List"
             cssClass="modal-fullscreen"
             (modalClosed)="closeModal()">
    <form [formGroup]="modalForm">
      <div class="panel bg-white">
        <div class="modal-search-section p-4 my-4 ">
          <div class="modal-search-wrapper flex items-end gap-2">
            <input-select-option-field
              [frmGroup]="modalForm"
              [controlName]="'homeOfficeId'"
              [label]="'Office ID'"
              [options]="officeOptions"
              [tooltip]="'Office'">
            </input-select-option-field>
            <generic-button
              labelText="search" class="!h-[36px] !px-4"
              (onClick)="getUserList()">
            </generic-button>
          </div>
        </div>
        <div class="component-section mt-3" *ngIf="showUserModalGrid">
          <lds-data-grid [id]="'user-search'" [enableSelection]="false"
                         [searchEnabled]="true"  [showEditButton]="true"
                         [useInlineEdit]="false" [dataSource]="userList" (onFHEditClick)="loadUser($event)"
                         [selectedColumns]="[
                                    'userId',
                                    'userName',
                                    'userDescription',
                                    'homeOfficeId',
                                    'userEmailId','employeeId'
                            ]">
          </lds-data-grid>
        </div>
      </div>
    </form>

    <!--    <div slot="footer">
          <Button class="modal-btn modal-btn-primary" [hidden] = "isModalButtonHidden" (click)="btnModal_click()" >{{buttonText}}</Button>
        </div>-->
  </generic-modal>
</div>
