<div class="page-wrapper">
  <div class="panel">
    <div class="container space-y-6 p-4 my-4">
      <app-expansion-panel-header
        [isOpenSignal]="businessHeaderPanel"
        [panelTitle]="'Password Policy Parameter'">
      </app-expansion-panel-header>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passLengthMax'"
          [label]="'Maximum Password Length'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passLengthMin'"
          [label]="'Minimum Password Length'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passHistoryDays'"
          [label]="'Password History Period (Days)'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passReuseMax'"
          [label]="'Password Reuse (Max)'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'failedLoginAttempts'"
          [label]="'Failed Login Attempts (Max)'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passExpPeriodDays'"
          [label]="'Password Expiry Period (Days)'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passExpAlertDays'"
          [label]="'Password Expiry Period Alert(Days)'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'nonAlphaNumCharMin'"
          [label]="'Character (Min)'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'smallCharMin'"
          [label]="'Minimum Small Letter'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'numberMin'"
          [label]="'Minimum Numeric Character'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'samePassConsequtive'"
          [label]="'Min Consecutive No of Using Pass'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'capitalCharMin'"
          [label]="'Minimum Capital Letter'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'samePassReuseAfter'"
          [label]="'Same Password Repeat After'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'recentMenuItem'"
          [label]="'Recent Menu Item'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <generic-switch
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passSuccSameCharAllow'"
          [isChecked]="frmGroup.get('passwordPolicy.passSuccSameCharAllow')?.value || false"
          [label]="'Is Repeated Character Succession Allowed'" [enable]="true"
        ></generic-switch>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'userInactiveNoLoginDays'"
          [label]="'Inactive User After No of Days'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'samePassRepeatAllow'"
          [label]="'Same Password repetition Allowed'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <generic-switch
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passExpForceChangeFlag'"
          [isChecked]="frmGroup.get('passwordPolicy.passExpForceChangeFlag')?.value || false"
          [label]="'Force Password Change on Expire'" [enable]="true"
        ></generic-switch>
    </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'favoriteMenuItem'"
          [label]="'Favourite Menu Item'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <input-number
          [frmGroup]="passwordPolicyForm"
          [controlName]="'adminUserGrade'"
          [label]="'Admin User Grade'"
          [isVertical]="true"
          [tooltip]="'Enter Number'"
          [tooltipDelay]="200">
        </input-number>
      </div>
      <div class="component-section">
        <generic-switch
          [frmGroup]="passwordPolicyForm"
          [controlName]="'passIsAlphanumeric'"
          [isChecked]="frmGroup.get('passwordPolicy.passIsAlphanumeric')?.value || false"
          [label]="'Is Password Alpha-Numeric'" [enable]="true"
        ></generic-switch>
      </div>
    </div>
  </div>
</div>
