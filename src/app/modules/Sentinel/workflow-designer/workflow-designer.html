  <div class="panel" *ngIf="levelForm.get('workflowName')?.value">
    <div class="container space-y-6 p-4 my-4">
      <app-sub-panel-header [subPanelTitle]="'Approval Level Configuration'"></app-sub-panel-header>

      <div class="flex flex-wrap items-center gap-4 justify-between">

        <input-number
          [frmGroup]="levelForm"
          [controlName]="'numberOfApprovalLevel'"
          [label]="'Number Of Levels'"
          
          [minValue]="1"
          [isReadonly]="!levelForm.get('workflowName')?.value"
          class="flex-shrink-0">
        </input-number>
                  <input-select-option-field
                    [frmGroup]="levelForm"
                    [controlName]="'appId'"
                    [label]="'Application'"
                    [options]="applicationOptions()"
                    
                    [placeholder]="'Select Application'">
                  </input-select-option-field>
        <div class="flex gap-3">
        <generic-button
          [label]="selectedLevel() ? 'Update Level' : 'Add Level'"
          [enable]="!isSavingLevel()"
          [icon]="isSavingLevel() ? 'hourglass_empty' : ''"
          (onClick)="saveLevel()">
        </generic-button>

        <generic-button
          [label]="'Delete Level'"
          [cssClass]="'bg-rose-600 text-white px-4'"
          [enable]="!!selectedLevel()"
          (onClick)="deleteLevel()">
        </generic-button>

        <generic-button
          [label]="'Clear Level Form'"
          [cssClass]="'bg-slate-500 text-white px-4'"
          (onClick)="resetLevelForm()">
        </generic-button>
       </div>
      </div>
    </div>
  </div>
<!--</div>-->


<!--<div class="page-wrapper" *ngIf="levelForm.get('workflowName')?.value">-->
  <div class="panel"  *ngIf="levelForm.get('workflowName')?.value">
    <div class="container space-y-6 p-4 my-4">
      <app-sub-panel-header [subPanelTitle]="'Approval Level Details & Role Mapping'"></app-sub-panel-header>


      <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
        <input-number
          [frmGroup]="detailForm"
          [controlName]="'approvalLevel'"
          [label]="'Approval Level'"
          
          [minValue]="1">
        </input-number>

        <input-select-option-field
          [frmGroup]="detailForm"
          [controlName]="'approvalPolicy'"
          [label]="'Approval Policy'"
          [options]="approvalPolicyOptions()"
          
          [placeholder]="'Select Policy'">
        </input-select-option-field>
        <input-number
          [frmGroup]="detailForm"
          [controlName]="'approverNo'"
          [label]="'No of Approver'"
          
          [minValue]="1">
        </input-number>
        </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-2">

        <div class="component-section">
<!--        <input-number-->
<!--          [frmGroup]="detailForm"-->
<!--          [controlName]="'organizationLevel'"-->
<!--          [label]="'Organisation Level'"-->
<!--          -->
<!--          [minValue]="0">-->
<!--        </input-number>-->
          <input-select-option-field
            [frmGroup]="detailForm"
            [controlName]="'organizationLevel'"
            [label]="'Organisation Level'"
            [options]="organizationLevelOptions()"
            
            [placeholder]="'Select Organization Type'">
          </input-select-option-field>
        </div>


        <input-select-option-field
          [frmGroup]="detailForm"
          [controlName]="'roleName'"
          [label]="'Add Role'"
          [options]="roleOptions()"
          
          [placeholder]="'Select Role'"
          (onSelect)="addRoleToSelection()">
        </input-select-option-field>

        <input-number
          [frmGroup]="detailForm"
          [controlName]="'workflowDetailId'"
          [label]="'Workflow Detail ID'"
          
          [minValue]="1"
          [isReadonly]="true">
        </input-number>
      </div>




      <div class="flex flex-col gap-2">
        <span class="text-sm font-semibold text-slate-600">Selected Roles</span>
        <div class="flex flex-wrap gap-2">
          <div
            class="role-chip"
            *ngFor="let role of selectedRoles()">
            <span class="role-chip__text">{{ role }}</span>
            <button
              type="button"
              class="role-chip__remove"
              (click)="removeRoleFromSelection(role)">
              &times;
            </button>
          </div>
        </div>
        <div class="text-xs text-slate-500" *ngIf="selectedRoles().length === 0">
          No roles selected for this level detail.
        </div>
      </div>

      <div class="flex flex-wrap gap-3 justify-end items-end">
        <generic-button
          [label]="selectedDetail() ? 'Update Detail' : 'Add Detail'"
          [enable]="!isSavingDetail()"
          (onClick)="saveDetail()">
        </generic-button>

        <generic-button
          [label]="'Delete Detail'"
          [cssClass]="'bg-rose-600 text-white px-4'"
          [enable]="!!selectedDetail()"
          (onClick)="deleteDetail()">
        </generic-button>

        <generic-button
          [label]="'Clear Detail Form'"
          [cssClass]="'bg-slate-500 text-white px-4'"
          (onClick)="resetDetailForm()">
        </generic-button>
      </div>
      <div *ngIf="selectedLevel()?.numberOfApprovalLevel" class="p-3 rounded border" [ngClass]="detailCountState().valid ? 'border-emerald-200 bg-emerald-50 text-emerald-700' : 'border-rose-200 bg-rose-50 text-rose-700'">
        <ng-container *ngIf="detailCountState().valid; else detailCountMismatch">
          All approval levels are configured.
        </ng-container>
        <ng-template #detailCountMismatch>
          Configure {{ detailCountState().required }} approval level detail{{ detailCountState().required === 1 ? '' : 's' }}. Currently configured: {{ detailCountState().actual }}.
        </ng-template>
      </div>
      <lds-data-grid
        [id]="'approval-detail-grid'"
        [enableSelection]="true"
        [dataSource]="levelDetails()"
        [selectedColumns]="['workflowDetailId','approvalLevel','approvalPolicy','policyDescription','approverNo','organizationLevel','roleCount','roles']"
        [customColumnNames]="{
          workflowDetailId: 'Detail ID',
          approvalLevel: 'Approval Level',
          approvalPolicy: 'Policy',
          policyDescription: 'Policy Description',
          approverNo: 'Approver No',
          organizationLevel: 'Org Level',
          roleCount: 'Role Count',
          roles: 'Assigned Roles'
        }"
        (onChecked)="onDetailSelection($event)"
        [initPageSize]="5">
      </lds-data-grid>
<!--
        [editableColumns]="['approvalLevel','approvalPolicy','approvalPolicy']"
        [dropdownColumns]="transactionDropdownColumns()"
        [dropdownOptions]="transactionDropdownOptions()"
        -->
    </div>
  </div>
<!--</div>-->

  <div class="panel" *ngIf="levelForm.get('workflowName')?.value">
    <div class="container space-y-6 p-4 my-4">
      <app-sub-panel-header [subPanelTitle]="'Eligible Approver Preview'"></app-sub-panel-header>

      <div class="flex flex-col md:flex-row items-end gap-4">
                  <input-select-option-field
                    [frmGroup]="selectorForm"
                    [controlName]="'moduleId'"
                    [label]="'Module'"
                    [options]="moduleOptions()"
                    
                    [placeholder]="'Select Module'"
                    [isReadonly]="!levelForm.get('appId')?.value">
                  </input-select-option-field>

                  <input-select-option-field
                    [frmGroup]="selectorForm"
                    [controlName]="'functionId'"
                    [label]="'Function'"
                    [options]="functionOptions()"
                    
                    [placeholder]="'Select Function'"
                    [isReadonly]="!selectorForm.get('moduleId')?.value">
                  </input-select-option-field>
                  <input-text-box
                    [frmGroup]="previewForm"
                    [controlName]="'makerId'"
                    [label]="'Maker User ID'"
                    >
                  </input-text-box>

        <div class="md:self-end">
          <generic-button
            [label]="isLoadingApprovers() ? 'Loading...' : 'Preview Approvers'"
            [enable]="!isLoadingApprovers()"
            (onClick)="previewApprovers()">
          </generic-button>
        </div>
      </div>

      <div *ngIf="previewPanelOpen()">
        <lds-data-grid
          [id]="'eligible-approvers-grid'"
          [dataSource]="approverRows()"
          [selectedColumns]="['approvalLevel','approvalPolicy','userId','userName','homeOfficeId','roleNames']"
          [customColumnNames]="{
            approvalLevel: 'Level',
            approvalPolicy: 'Policy',
            userId: 'Approver ID',
            userName: 'Approver Name',
            homeOfficeId: 'Office',
            roleNames: 'Roles'
          }"
          [initPageSize]="5">
        </lds-data-grid>
      </div>
    </div>
  </div>
