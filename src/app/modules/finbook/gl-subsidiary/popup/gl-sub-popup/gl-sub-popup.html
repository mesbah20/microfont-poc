<div class="page-wrapper">
  <generic-modal
    [isVisible]="showModal"
    [modalTitle]="'Find Subsidiary Account'"
    [cssClass]="'modal-sm'"
    (isVisibleChanged)="onModalVisibilityChange($event)">
    <form [formGroup]="mdForm" class="transaction-form">
      <div class="panel">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 p-3">
          <div class="component-section">
            <input-select-option-field
              [frmGroup]="mdForm"
              [controlName]="'officeId'"
              [label]="'Office'"
              [options]="officeOptions"
              [tooltip]="'Select Office'">
            </input-select-option-field>
          </div>

          <div class="component-section">
            <input-text-box
              [frmGroup]="mdForm"
              [controlName]="'glAccSl'"
              [label]="'GL Key'"
              [isReadonly]="false"
              tooltip="Enter GL Key"
              tooltipPosition="above"
              [tooltipDelay]="200"
              [isVertical]="true"
              [customErrorMessages]="{
                required: 'Account number is required',
                minlength: 'At least 5 digits',
                maxlength: 'Max 15 characters'
              }"
              (onBlurred)="onGLSerialChange()">
            </input-text-box>
          </div>

          <div class="component-section flex items-end">
            <button
              type="button"
              class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded"
              (click)="onSearch()">
              Search
            </button>
          </div>
        </div>

        <div class="p-4">
          <lds-data-grid
            [id]="'gl-subsidiary-results'"
            [enableSelection]="true"
            [useInlineEdit]="false"
            [dataSource]="accounts"
            (onChecked)="onRowSelect($event)"
            [selectedColumns]="['officeId','glAccSl', 'glAccSubSl', 'glAccSubNm']"
            [customColumnNames]="{
              officeId : 'Office',
              glAccSl: 'GL Serial',
              glAccSubSl : 'GL Subsidiary Serial',
              glAccSubNm: 'GL Subsidiary Name'
            }">
          </lds-data-grid>
        </div>
      </div>
    </form>
  </generic-modal>
</div>
