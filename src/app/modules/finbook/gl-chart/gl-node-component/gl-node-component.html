<div class="node-wrapper" 
     [ngClass]="{'no-children': !node.children || node.children.length === 0}" 
     [style.padding-left.px]="level * 20">
  
  <!-- Vertical line -->
  <div class="node-line" [style.left.px]="level * 20"></div>

  <!-- Expand/Collapse button -->
  <button mat-icon-button (click)="toggle()" class="expand-btn">
    <mat-icon>
      {{ node!.children!.length > 0 ? (node!.expanded ? 'expand_more' : 'chevron_right') : 'remove' }}
    </mat-icon>
  </button>

  <!-- Node text + menu inline -->
  <div class="node-content">
    <span class="node-title">{{node.GL_ACC_SL}} - {{node.ACCOUNT_NO}} - {{ node.ACCOUNT_TITLE }}</span>

    <!-- Three dots menu -->
    <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-btn">
      <mat-icon>more_vert</mat-icon>
    </button>
  </div>

  <!-- Menu definition -->
  <mat-menu #menu="matMenu" class="ultra-compact-menu">
    <button mat-menu-item (click)="addChild()" [disabled]="node.txnFlag !== 0 || node.hasChildren === false">
      <mat-icon class="menu-icon" style="font-size: 21px;">add</mat-icon>
      <span style="font-size: 10px;">Add Child</span>
    </button>
    <button mat-menu-item (click)="editDetails()">
      <mat-icon class="menu-icon" style="font-size: 21px;">edit</mat-icon>
      <span style="font-size: 10px;">Edit</span>
    </button>
    <button mat-menu-item (click)="viewDetails()">
      <mat-icon class="menu-icon" style="font-size: 21px;">visibility</mat-icon>
      <span style="font-size: 10px;">View</span>
    </button>
  </mat-menu>
</div>

<!-- Children recursively -->
<div *ngIf="node.expanded && node.children.length > 0">
  <app-account-node *ngFor="let child of node.children" [node]="child" [level]="level + 1"
    (childAdded)="childAdded.emit($event)">
  </app-account-node>
</div>

<generic-modal
  [isVisible]="showModal"
  [modalTitle]="'GL Account'"
  [modalComponent]="modalComponent || modalHostComponent"
  [modalComponentData]="modalComponentData"
  (modalClosed)="onModalClose(false)"
  (modalResult)="onModalResult($event)">
</generic-modal>
