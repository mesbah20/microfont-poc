<div class="page-wrapper">
    <!-- Loading Indicator -->
    @if (loading()) {
      <div class="flex justify-center items-center py-20">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    }

    <!-- Form Content -->
    @if (!loading()) {
      <form [formGroup]="connectionForm" class="p-8">

        <!-- Report DB Connection Information Section -->
        <div class="mb-8">
          <app-expansion-panel-header [isOpenSignal]="reportDbPanel" [panelTitle]="'Report DB Connection Information'"></app-expansion-panel-header>

          @if (reportDbPanel()) {
          <div class="form-grid-col-1">
                <!-- Connection ID (Auto-generated) -->
                <lds-id-box
                  [frmGroup]="connectionForm"
                  [controlName]="'id'"
                  [label]="'Connection ID (Auto-generated)'"
                  [isVertical]="true"
                  [isDotsVisible]="true"
                  [tooltip]="'Click to search connections'"
                  [tooltipPosition]="'above'"
                  [placeholder]="'Auto-generated by system'"
                  [tooltipDelay]="300"
                  (dotsClicked)="openConnectionModal()"
                  (onChanged)="onIdChanged($event)"
                ></lds-id-box>
              

            <!-- Connection Name -->
            <app-text-base-input
              [frmGroup]="connectionForm"
              controlName="connectionName"
              label="Connection Name"
              [isVertical]="true"
              [maxLength]="100"
              placeholder="e.g., Oracle Production Database"
            >
            </app-text-base-input>

            <!-- Database Type -->
            <app-select-option-field
              [frmGroup]="connectionForm"
              controlName="databaseType"
              label="Database Type"
              [options]="databaseTypeOptions"
              [isVertical]="true"
              [searchable]="true"
              placeholder="Select database type"
            >
            </app-select-option-field>

            <!-- DB Server Address -->
            <app-text-base-input
              [frmGroup]="connectionForm"
              controlName="dbServerAddress"
              label="DB Server Address"
              [isVertical]="true"
              [maxLength]="200"
              placeholder="e.g., 192.168.1.100:1521"
            >
            </app-text-base-input>

            <!-- Database Name -->
            <app-text-base-input
              [frmGroup]="connectionForm"
              controlName="databaseName"
              label="Database Name / Service Name"
              [isVertical]="true"
              [maxLength]="100"
              placeholder="e.g., BUPRIM"
            >
            </app-text-base-input>

            <!-- User Name -->
            <app-text-base-input
              [frmGroup]="connectionForm"
              controlName="userName"
              label="User Name"
              [isVertical]="true"
              [maxLength]="50"
              placeholder="e.g., ultimus"
            >
            </app-text-base-input>

            <!-- Password -->
            <app-text-base-input
              [frmGroup]="connectionForm"
              controlName="password"
              label="Password"
              [isVertical]="true"
              [maxLength]="50"
              [type]="'password'"
              placeholder="Enter password"
            >
            </app-text-base-input>

            <!-- Default Connection Checkbox -->
            <!-- <div class="flex items-center pt-8">
              <input
                type="checkbox"
                id="defaultConnection"
                formControlName="isDefaultConnection"
                class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2"
              />
              <label
                for="defaultConnection"
                class="ml-2 text-sm font-medium text-gray-700"
              >
                Default Database Connection
              </label>
            </div> -->

            <!-- <lds-switch
            [frmGroup]="connectionForm"
            [controlName]="'isDefaultConnection'"
            [labelText]="'Default Database Connection'"
            [isChecked]="connectionForm.get('isDefaultConnection')?.value || false"
          ></lds-switch> -->

          </div>

          <!-- Action Buttons -->
          <!-- <div class="mt-8 flex gap-3 justify-end border-t pt-6">
            <lds-btn
              [labelText]="'Test Connection'"
              [icon]="'wifi_tethering'"
              [enable]="!loading()"
              (onClick)="onTestConnection()"
              [cssClass]="'bg-green-600 hover:bg-green-700 text-white'"
            ></lds-btn>
          </div> -->
          }
        </div>
      </form>
    }
</div>
