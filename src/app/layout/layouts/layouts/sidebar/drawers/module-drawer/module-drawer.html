<div class="h-full overflow-y-auto pb-16 bg-white module-drawer bg-[var(--theme-background)]">
    <div class="p-6">

        <!-- Loading State -->
        <div *ngIf="isLoading" class="flex justify-center items-center h-40">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
        </div>

        <!-- Error State -->
        <div *ngIf="error && !isLoading" class="text-center text-red-500 p-4">
            {{ error }}
        </div>

        <!-- Modules Grid -->
        <div *ngIf="!isLoading && !error" class="grid grid-cols-3 gap-3 md:max-w-4xl mx-auto">

            <!-- Dynamic Module Items -->
            <div *ngFor="let module of modulesList" 
                 (click)="selectModule(module.id)"
                 [class]="getModuleClasses(module)">

                <!-- Icon Circle -->
                <div class="w-12 h-12 rounded-full bg-gradient-to-tr flex items-center justify-center text-white text-xl shadow-sm mb-2 transition-transform duration-300"
                    [class]="getIconClasses(module)">
                    {{ module.icon }}
                </div>

                <!-- Module Name -->
                <h2 class="text-sm font-semibold text-gray-800 leading-tight px-1">{{ module.name }}</h2>

                <!-- Selection Indicator -->
                <div *ngIf="isModuleSelected(module.id)" 
                     class="absolute top-1 right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-white">
                </div>

            </div>
        </div>
    </div>
</div>
