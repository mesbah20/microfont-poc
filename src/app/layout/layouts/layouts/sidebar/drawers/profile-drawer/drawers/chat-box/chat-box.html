<!-- chat.component.html -->
<div class="h-screen pb-16 bg-gradient-to-br from-green-50 to-blue-50 flex flex-col max-w-md mx-auto shadow-xl max-h-[600px]">

  <div class="sticky top-0 z-20">
    <!-- Chat header -->
    <div class="bg-gradient-to-r from-green-600 to-green-700 text-white px-5 py-4 flex items-center shadow-lg">
      <div class="w-12 h-12 rounded-full bg-white/20 mr-3 flex items-center justify-center text-white font-bold text-lg shadow-md">
        M
      </div>
      <div class="flex-1">
        <h2 class="text-base font-semibold">Mahfuz</h2>
        <div class="flex items-center">
          <div class="w-2 h-2 rounded-full bg-green-300 mr-2 animate-pulse"></div>
          <p class="text-xs text-green-100">Online</p>
        </div>
      </div>
      <div class="flex space-x-3">
        <button
          (click)="toggleSearch()"
          class="hover:text-white/80 transition-all hover:scale-105 p-2 rounded-full hover:bg-white/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
        <button class="hover:text-white/80 transition-all hover:scale-105 p-2 rounded-full hover:bg-white/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
          </svg>
        </button>
        <button
          (click)="onCloseClick()"
          class="hover:text-white/80 transition-all hover:scale-105 p-2 rounded-full hover:bg-white/10">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Box -->
    <div
      class="bg-white border-b border-gray-200 px-4 transition-all duration-500 ease-in-out"
      [style.opacity]="isSearchOpen ? '1' : '0'"
      [style.max-height]="isSearchOpen ? '80px' : '0px'"
      [class.py-3]="isSearchOpen"
      [class.pointer-events-auto]="isSearchOpen">
      <div class="flex items-center space-x-3">
        <button
          (click)="closeSearch()"
          class="text-gray-500 hover:text-gray-700 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
        <input
          [(ngModel)]="searchQuery"
          (keydown)="onSearchEnter($event)"
          type="text"
          placeholder="Search messages..."
          class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 text-sm bg-gray-50 focus:bg-white transition-all"
          #searchInput>
        <button class="text-green-600 hover:text-green-700 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="flex-1 p-4 pb-8 space-y-4 overflow-y-auto">

    <!-- Date separator -->
    <div class="flex justify-center">
      <span class="bg-white/80 backdrop-blur-sm text-gray-500 text-xs px-3 py-1 rounded-full shadow-sm">Today</span>
    </div>

    <!-- Messages Loop -->
    @for (message of messages; track $index) {
      <div class="animate-fadeInUp">

        <!-- Received Message -->
        <div *ngIf="message.sender === 'other'" class="flex items-start">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 mr-3 mt-1 flex items-center justify-center text-sm font-semibold text-white shadow-md">
            A
          </div>
          <div class="bg-white p-3 rounded-2xl shadow-sm max-w-[75%] hover:shadow-md transition-shadow">
            <p class="text-sm text-gray-800">{{ message.text }}</p>
            <p class="text-xs text-gray-400 text-right mt-1">{{ message.time }}</p>
          </div>
        </div>

        <!-- Sent Message -->
        <div *ngIf="message.sender === 'me'" class="flex justify-end">
          <div class="bg-gradient-to-r from-green-100 to-green-50 p-3 rounded-2xl shadow-sm max-w-[75%] hover:shadow-md transition-shadow">
            <p class="text-sm text-gray-800">{{ message.text }}</p>

            <!-- Preview for specific message -->
            <!--          <div *ngIf="message.text.includes('preview')" class="mt-3 bg-white p-3 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow">-->
            <!--            <div class="flex items-center space-x-3">-->
            <!--              <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-green-500 to-blue-500 flex items-center justify-center">-->
            <!--                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">-->
            <!--                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />-->
            <!--                </svg>-->
            <!--              </div>-->
            <!--              <div class="flex-1">-->
            <!--                <p class="font-medium text-gray-700 text-sm">ChatApp Design</p>-->
            <!--                <p class="text-xs text-gray-400">Enhanced UI with animations</p>-->
            <!--              </div>-->
            <!--            </div>-->
            <!--          </div>-->

            <div class="flex justify-end items-center mt-2 space-x-1">
              <p class="text-xs text-gray-400">{{ message.time }}</p>
              <!-- Single tick for unread, double tick for read -->
              <svg *ngIf="!message.isRead" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
              <div *ngIf="message.isRead" class="flex">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-blue-500 -ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    }

    <!-- Typing indicator -->
    <div *ngIf="isTyping" class="flex items-start">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 mr-3 mt-1 flex items-center justify-center text-sm font-semibold text-white shadow-md">
        A
      </div>
      <div class="bg-white p-3 rounded-2xl shadow-sm">
        <div class="flex space-x-1">
          <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></div>
          <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
          <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Input area -->
  <div class="bg-white/90 backdrop-blur-sm border-t border-gray-200 p-4 fixed bottom-0 left-0 right-0 shadow-lg max-w-md mx-auto">
    <div class="flex items-center space-x-3">
      <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-all hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </button>
      <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-full transition-all hover:scale-105">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
        </svg>
      </button>
      <input
        [(ngModel)]="messageText"
        (keydown)="onEnterKey($event)"
        type="text"
        placeholder="Type a message..."
        class="flex-1 border border-gray-300 rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-500 text-sm bg-gray-50 focus:bg-white transition-all">
      <button
        (click)="sendMessage()"
        class="p-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-full hover:from-green-600 hover:to-green-700 transition-all hover:scale-105 shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </div>
  </div>
</div>
