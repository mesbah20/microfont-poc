<div
  class="h-full overflow-y-auto pb-16 profile-drawer bg-gradient-to-br from-[var(--theme-background)] to-gray-50"
>
  <div class="p-6 space-y-6 pt-4">
    <!-- Profile Section -->
    <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-6 border border-gray-200/60 shadow-lg">
      <div class="flex items-center space-x-4 mb-4">
        <div class="relative">
          <div
            class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg"
          >
            <mat-icon class="text-white text-2xl">person</mat-icon>
          </div>
          <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-green-500 rounded-full border-2 border-white"></div>
        </div>
        <div class="flex-1">
          <h3 class="text-xl font-semibold text-gray-800 mb-1">Saikat</h3>
          <p class="text-sm text-gray-600 mb-2">saikat.gmail.com</p>
          <div class="flex items-center space-x-2">
            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
              <span class="w-2 h-2 bg-green-500 rounded-full mr-1"></span>
              Online
            </span>
            <span class="text-xs text-gray-500">Member since 2024</span>
          </div>
        </div>
      </div>
      <button
        class="w-full bg-gradient-to-r from-[var(--theme-primary)] to-[var(--theme-accent)] text-white py-3 rounded-xl hover:shadow-lg transform hover:scale-[1.02] transition-all duration-200 flex items-center justify-center font-medium"
        (click)="openEditProfileModal()">
        <mat-icon class="mr-2">edit</mat-icon>
        Edit Profile
      </button>
    </div>

    <!-- Quick Actions Grid -->
    <div class="grid grid-cols-2 gap-4">
      <!-- Service Request -->
      <button
        class="bg-white/80 backdrop-blur-sm rounded-2xl p-4 border border-gray-200/60 shadow-sm hover:shadow-lg transition-all duration-200 transform hover:scale-[1.02] cursor-pointer"
        (click)="openServiceRequestModal()"
      >
        <div class="flex flex-col items-center text-center space-y-3">
          <div
            class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-xl flex items-center justify-center shadow-md"
          >
            <mat-icon class="text-white text-xl">support_agent</mat-icon>
          </div>
          <div>
            <p class="font-semibold text-gray-800 text-sm">Service Request</p>
            <p class="text-xs text-gray-600 mt-1">Request new services</p>
          </div>
        </div>
      </button>

      <!-- Branch -->
      <button
        class="bg-white/80 backdrop-blur-sm rounded-2xl p-4 border border-gray-200/60 shadow-sm hover:shadow-lg transition-all duration-200 transform hover:scale-[1.02] cursor-pointer"
      >
        <div class="flex flex-col items-center text-center space-y-3">
          <div
            class="w-12 h-12 bg-gradient-to-br from-orange-400 to-orange-600 rounded-xl flex items-center justify-center shadow-md"
          >
            <mat-icon class="text-white text-xl">account_tree</mat-icon>
          </div>
          <div>
            <p class="font-semibold text-gray-800 text-sm">Branch</p>
            <p class="text-xs text-gray-600 mt-1">Dhanmondi</p>
          </div>
        </div>
      </button>
    </div>

    <!-- Menu Items -->
    <div class="space-y-3">
      <!-- Notes -->
      <button
        class="w-full bg-white/80 backdrop-blur-sm rounded-2xl p-4 border border-gray-200/60 shadow-sm hover:shadow-lg transition-all duration-200 transform hover:scale-[1.02] cursor-pointer"
        (click)="goToNotes()">
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 bg-gradient-to-br from-purple-400 to-purple-600 rounded-xl flex items-center justify-center shadow-md">
            <mat-icon class="text-white text-xl">list_alt</mat-icon>
          </div>
          <div class="flex-1 text-left">
            <p class="font-semibold text-gray-800">Notes</p>
            <p class="text-sm text-gray-600">My personal notes</p>
          </div>
          <mat-icon class="text-gray-400 transform transition-transform group-hover:translate-x-1">chevron_right</mat-icon>
        </div>
      </button>

      <!-- Notifications -->
      <div
        class="bg-white/80 backdrop-blur-sm rounded-2xl p-4 border border-gray-200/60 shadow-sm hover:shadow-lg transition-all duration-200 cursor-pointer"
        (click)="toggleNotificationsPopover($event)">
        <div class="flex items-center space-x-4">
          <div class="relative">
            <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-blue-600 rounded-xl flex items-center justify-center shadow-md">
              <mat-icon class="text-white text-xl">notifications</mat-icon>
            </div>
            <div *ngIf="(novuService.getUnreadCount() | async) as unreadCount" 
                 class="absolute -top-1 -right-1 w-6 h-6 bg-red-500 rounded-full flex items-center justify-center border-2 border-white">
              <span class="text-white text-xs font-bold">{{ unreadCount || 0 }}</span>
            </div>
          </div>
          <div class="flex-1">
            <p class="font-semibold text-gray-800">Notifications</p>
            <p class="text-sm text-gray-600">Latest alerts and updates</p>
          </div>
          <mat-icon class="text-gray-400 transform transition-transform group-hover:translate-x-1">chevron_right</mat-icon>
        </div>
      </div>
    </div>

    <!-- Theme -->
    <div class="border-b border-gray-200 pb-2">
      <button
        class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-blue-50 transition-colors duration-150 cursor-pointer">
              <div class="w-12 h-12 bg-gradient-to-br from-pink-400 to-pink-600 rounded-xl flex items-center justify-center shadow-md">
          <mat-icon class="text-white text-xl">palette</mat-icon>
        </div>
        <div class="flex-1 text-left">
          <p class="font-medium text-gray-800">Theme</p>
          <p class="text-sm text-gray-600">Choose your theme</p>
        </div>
        <app-theme-picker></app-theme-picker>
      </button>
    </div>
  </div>
</div>

<!-- Chat Drawer -->
<div
  class="fixed bottom-[20px] right-[10px] w-[400px] bg-white shadow-2xl transform transition-all duration-300 ease-in-out border border-gray-200
    rounded-lg overflow-hidden flex flex-col z-50"
  [style.transform]="isChatOpen() ? 'translateY(0)' : 'translateY(100%)'"
  [style.opacity]="isChatOpen() ? '1' : '0'"
  [style.visibility]="isChatOpen() ? 'visible' : 'hidden'">
  <app-chat-box [closeChat]="closeChatFromChild.bind(this)"></app-chat-box>
  <div
    class="absolute right-0 top-0 h-full w-1 bg-gray-200 hover:bg-blue-400 cursor-col-resize transition-colors duration-200"></div>
</div>

<!-- Notification Detail Modal -->
<app-notification-detail-modal
  *ngIf="showDetailModal && selectedNotification"
  [notification]="selectedNotification!"
  (close)="closeDetailModal()"
>
</app-notification-detail-modal>

<!-- Dynamic Modal -->
<lds-modal
  #modalComponentRef
  [isVisible]="showModal || showEditProfileModal"
  [modalTitle]="showEditProfileModal ? 'Edit Profile' : 'Service Request'"
  [modalComponent]="modalComponent"
  [modalComponentData]="showEditProfileModal ? modalData : modalComponentData"
  [okButtonText]="showEditProfileModal ? 'Update Profile' : modalOkButtonText()"
  (isVisibleChanged)="onModalVisibilityChange($event)"
  (modalResult)="onModalResult($event)"
  (modalClosed)="onModalClosed()"
  [cssClass]="'modal-lg'"
  [showOkButton]="true"
  [showDefaultFooter]="true">
</lds-modal>
