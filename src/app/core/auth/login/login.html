<div class="page-wrapper">
  <div class="flex justify-center items-center min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-blue-50 relative overflow-hidden py-8 px-4">
    <!-- Enhanced animated background elements -->
    <div class="absolute w-[600px] h-[600px] bg-[radial-gradient(circle,rgba(138,43,226,0.08)_0%,transparent_70%)] top-[-150px] right-[-150px] rounded-full animate-float"></div>
    <div class="absolute w-[500px] h-[500px] bg-[radial-gradient(circle,rgba(59,130,246,0.08)_0%,transparent_70%)] bottom-[-150px] left-[-150px] rounded-full animate-float-reverse"></div>
    <div class="absolute w-[300px] h-[300px] bg-[radial-gradient(circle,rgba(16,185,129,0.06)_0%,transparent_70%)] top-[50%] left-[50%] transform -translate-x-1/2 -translate-y-1/2 rounded-full animate-pulse-slow"></div>
    
    <!-- Floating particles -->
    <div class="absolute w-2 h-2 bg-indigo-300 rounded-full top-[20%] left-[15%] animate-float-small"></div>
    <div class="absolute w-3 h-3 bg-purple-300 rounded-full top-[70%] right-[20%] animate-float-small-reverse"></div>
    <div class="absolute w-1 h-1 bg-blue-400 rounded-full top-[40%] right-[10%] animate-float-tiny"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-lg rounded-2xl shadow-2xl p-8 relative z-10 border border-white/70 login-container mx-4">
      <!-- Glassmorphism overlay -->
      <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-white/5 rounded-2xl"></div>
      
      <!-- Logo and Header -->
      <div class="text-center mb-6 relative z-10">
        <!-- Logo with glow effect -->
        <div class="mb-4 flex justify-center">
          <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 via-purple-600 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg logo-glow">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
        </div>
        <h1 class="text-4xl font-bold bg-gradient-to-br from-indigo-600 via-purple-600 to-blue-700 bg-clip-text text-transparent tracking-wide mb-2 title-animation">MicroCube</h1>
        <p class="text-gray-500 text-sm font-medium">Core Banking System</p>
        <div class="w-24 h-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full mx-auto mt-3"></div>
      </div>

      <!-- Login Form -->
      <form [formGroup]="frmGroup" (ngSubmit)="doLogin()" class="space-y-4 relative z-10">
        <!-- Username Field -->
        <div class="form-group">
          <label for="username" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
            <span class="mr-1">👤</span> Username
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none transition-colors duration-300 group-focus-within:text-indigo-500">
              <svg class="h-5 w-5 text-gray-400 group-focus-within:text-indigo-500 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <input
              formControlName="username"
              type="text"
              id="username"
              class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white bg-gray-50/50 transition-all duration-300 focus:ring-2 focus:ring-indigo-500/20 focus:shadow-lg hover:border-gray-300 input-glow"
              placeholder="Enter your username"
              required
            >
            <!-- Input border animation -->
            <div class="absolute inset-0 rounded-xl border-2 border-transparent bg-gradient-to-r from-indigo-500 to-purple-600 opacity-0 group-focus-within:opacity-100 transition-opacity duration-300 -z-10"></div>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="block text-sm font-semibold text-gray-700 mb-2 flex items-center">
            <span class="mr-1">🔒</span> Password
          </label>
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none transition-colors duration-300 group-focus-within:text-indigo-500">
              <svg class="h-5 w-5 text-gray-400 group-focus-within:text-indigo-500 transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input
              formControlName="password"
              type="password"
              id="password"
              class="w-full pl-10 pr-12 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 focus:bg-white bg-gray-50/50 transition-all duration-300 focus:ring-2 focus:ring-indigo-500/20 focus:shadow-lg hover:border-gray-300 input-glow"
              placeholder="Enter your password"
              required
            >
            <button
              type="button"
              class="absolute inset-y-0 right-0 pr-3 flex items-center hover:scale-110 transition-transform duration-200"
              (click)="togglePasswordVisibility()"
            >
              <svg *ngIf="!showPassword" class="h-5 w-5 text-gray-400 hover:text-indigo-500 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg *ngIf="showPassword" class="h-5 w-5 text-gray-400 hover:text-indigo-500 transition-colors duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
              </svg>
            </button>
            <!-- Input border animation -->
            <div class="absolute inset-0 rounded-xl border-2 border-transparent bg-gradient-to-r from-indigo-500 to-purple-600 opacity-0 group-focus-within:opacity-100 transition-opacity duration-300 -z-10"></div>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="text-right">
          <a href="#" class="text-sm font-medium text-indigo-500 hover:text-purple-600 transition-all duration-200 hover:underline flex items-center justify-end group">
            <span>Forgot Password?</span>
            <svg class="w-3 h-3 ml-1 group-hover:translate-x-1 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </a>
        </div>

        <!-- Error Message -->
        <div *ngIf="loginError" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm flex items-center animate-shake">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          {{ errorMessage }}
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          [disabled]="frmGroup.invalid || isLoading"
          class="w-full py-4 bg-gradient-to-r from-indigo-500 via-purple-600 to-indigo-700 text-white rounded-xl font-semibold hover:from-indigo-600 hover:via-purple-700 hover:to-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed relative overflow-hidden group login-button"
        >
          <!-- Button shine effect -->
          <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-out"></div>
          
          <span *ngIf="isLoading" class="flex items-center justify-center relative z-10 text-white">
            <svg class="animate-spin h-5 w-5 mr-2 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Signing In...
          </span>
          <span *ngIf="!isLoading" class="flex items-center justify-center relative z-10 text-white">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            Sign In
          </span>
        </button>

        <!-- Security Badge -->
        <!-- <div class="flex items-center justify-center gap-2 mt-4 p-2 bg-gradient-to-r from-emerald-50 to-blue-50 rounded-lg text-gray-600 text-xs border border-gray-100 security-badge">
          <div class="flex items-center gap-1">
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <span class="font-medium">Secured with 256-bit SSL encryption</span>
        </div> -->

        <!-- Additional Features -->
        <div class="flex justify-center gap-4 mt-3 text-xs text-gray-400">
          <div class="flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <span>Secure</span>
          </div>
          <div class="flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
            <span>Fast</span>
          </div>
          <div class="flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Reliable</span>
          </div>
        </div>
      </form>

      <!-- Footer -->
      <div class="text-center mt-5 text-xs text-gray-400 relative z-10">
        <div class="mb-2">© 2025 MicroCube. All rights reserved.</div>
        <div class="text-gray-300">Core Banking System v2.0</div>
      </div>
    </div>
  </div>
</div>
