<div class="page-wrapper">
  <div class="flex justify-center items-center min-h-[100dvh] -mb-4">
    <div class="w-full max-w-md ">
      <!-- Logo and Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-800 rounded-2xl mb-4">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-semibold text-slate-800 mb-2">MicroCube</h1>
<!--        <p class="text-slate-600">Access your banking dashboard</p>-->
      </div>

      <!-- Login Form -->
      <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 p-8 pt-0">
        <form [formGroup]="frmGroup" class="space-y-6">
          <!-- Username/Email Field -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">
              Username
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
              </div>
              <input formControlName="username"
                type="text"
                name="username"
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-transparent transition-all duration-200 bg-slate-50 focus:bg-white"
                placeholder="Enter your username"
                required
              >
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">
              Password
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input formControlName="password"
                type="password"
                name="password"
                class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-transparent transition-all duration-200 bg-slate-50 focus:bg-white"
                placeholder="Enter your password"
                required
              >
              <button
                type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center"
              >
                <svg id="eye-open" class="h-5 w-5 text-slate-400 hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Remember Me and Forgot Password -->
<!--          <div class="flex items-center justify-between">-->
<!--            <div class="flex items-center">-->

<!--                id="remember-me"-->

          <!-- Error Message -->
          @if (loginError) {
            <div class="text-red-600 text-sm text-center">
              {{errorMessage}}
            </div>
          }

          <!-- Login Button -->
          <button (click)="doLogin()"
            type="submit"
            class="cursor-pointer w-full bg-slate-800 text-white py-3 px-4 rounded-xl font-medium hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:ring-offset-2 transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98]"
          >
            Sign In
          </button>
